[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8.3.1,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidxmltodict"
dynamic = ["version"]
description = "RapidXML accelerated XML-to-dict with xmltodict-compatible output"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "vendor/rapidxml/license.txt"]
authors = [{name = "Alisher Nazarkhanov"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "build", "packaging>=24", "xmltodict==1.0.4"]
typing = ["mypy>=1.14,<2", "pyright>=1.1.390", "typing_extensions>=4.12", "jedi>=0.19"]

[project.urls]
Homepage = "https://github.com/nazarkhanov/rapidxmltodict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
rapidxmltodict = ["*.pyi", "py.typed"]

[tool.setuptools_scm]
version_file = "src/rapidxmltodict/_version.py"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?)$'

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
test-requires = ["pytest>=8", "packaging>=24", "xmltodict==1.0.4"]
test-command = "python -m pytest {project}/tests -q"
