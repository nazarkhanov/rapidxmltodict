name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never interrupt a publication. Re-running failed jobs preserves built artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools-scm>=8.3.1,<9' packaging
      - id: tag
        name: Validate canonical tag and derived version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_checks.py "$TAG" --github-output "$GITHUB_OUTPUT"

  # Same tests/builds as PRs, repeated for this exact release commit.
  tested-distributions:
    needs: validate
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  verify:
    needs: [validate, tested-distributions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: python -m pip install twine packaging
      - run: python -m twine check --strict dist/*
      - name: Check every wheel and sdist has the exact tag version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_checks.py "$TAG" --dist dist
      - name: Compose curated release notes from the tagged source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/prepare_release_notes.py "$VERSION" --output release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, verify]
    if: ${{ github.repository == 'nazarkhanov/rapidxmltodict' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rapidxmltodict/${{ needs.validate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      # No source checkout or project code runs with OIDC publishing permission.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish tested distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          # Fail on existing files instead of silently accepting mismatched uploads.
          skip-existing: false

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create release notes after successful PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$TAG" --generate-notes
                --notes-file notes/release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          # Handle rerunning only this job if release creation already succeeded.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/releases/tags/$TAG" > existing-release.json
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path("existing-release.json").read_text())
          if release["draft"]:
              raise SystemExit("Existing release is still a draft; inspect and repair it manually.")
          expected_notes = Path("notes/release-notes.md").read_text(encoding="utf-8").strip()
          if not release.get("body", "").startswith(expected_notes):
              raise SystemExit("Existing release lacks the expected curated notes; inspect it manually.")
          assets = {asset["name"]: asset for asset in release["assets"]}
          for path in Path("dist").iterdir():
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if assets.get(path.name, {}).get("digest") != digest:
                  raise SystemExit(
                      f"Existing release has a missing or unverified asset: {path.name}. "
                      "Repair using the original artifacts; do not rerun PyPI publication."
                  )
          print("Existing published release contains every expected artifact with matching SHA-256.")
          PY
          else
            gh release create "$TAG" dist/* "${args[@]}"
          fi
