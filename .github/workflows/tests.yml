name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m build
  reference-014:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' 'xmltodict==0.14.2'
      - run: python -m pytest -q
  typing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        xmltodict: ['0.14.2', '1.0.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,typing]' 'xmltodict==${{ matrix.xmltodict }}'
      - run: python -m build
      - run: python tests/typing/check_artifacts.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python tests/typing/check.py
      - run: python -m pytest -q
